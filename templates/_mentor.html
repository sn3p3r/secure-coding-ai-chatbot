<!-- SECUREMENTOR BUTTON -->
<button
    id="mentor-button"
    class="mentor-floating-button"
    type="button"
>
    SECUREMENTOR
</button>


<!-- SECUREMENTOR PANEL -->
<div
    id="mentor-panel"
    class="mentor-panel hidden"
>

    <div class="mentor-header">

        <div>
            <span class="mentor-label">
                AI CODING MENTOR
                <span id="mentor-status" class="mentor-status">CHECKING...</span>
            </span>

            <h2>
                SecureMentor
            </h2>
        </div>

        <button
            id="mentor-close"
            class="mentor-close"
            type="button"
        >
            ×
        </button>

    </div>


    <div id="mentor-actions" class="mentor-actions hidden"></div>


    <div
        id="mentor-messages"
        class="mentor-messages"
    >

        <div class="mentor-message">

            <strong>SecureMentor</strong>

            <p>
                I'm here to help you understand code,
                programming, and secure coding concepts.
                On a level page, use the buttons above for
                help with exactly where you are.
            </p>

        </div>

    </div>


    <div class="mentor-code-area">

        <label for="mentor-code">
            OPTIONAL CODE
        </label>

        <textarea
            id="mentor-code"
            placeholder="Paste code here..."
        ></textarea>

    </div>


    <div class="mentor-input-area">

        <textarea
            id="mentor-question"
            placeholder="Ask SecureMentor..."
        ></textarea>

        <button
            id="mentor-send"
            type="button"
        >
            ASK
        </button>

    </div>

</div>
